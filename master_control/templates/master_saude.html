<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Saúde do Servidor - Master Control</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #15161e; color: #fff; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #1e1f2b; padding: 25px 20px; border-right: 1px solid #2a2b3d; flex-shrink: 0; }
        .sidebar h2 { color: #f39c12; margin-top: 0; margin-bottom: 30px; font-size: 1.5em; text-align: center; }
        .sidebar a { display: block; color: #d1d1d1; text-decoration: none; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; transition: 0.2s; }
        .sidebar a:hover { background-color: #2a2b3d; color: #f39c12; }
        .sidebar a.ativo { background-color: #f39c12; color: #15161e; font-weight: bold; }
        .sidebar a.ativo:hover { background-color: #e67e22; color: #15161e; }
        
        .content { flex: 1; padding: 40px; overflow-y: auto; min-width: 0; display: flex; flex-direction: column; }
        .content h1 { margin-top: 0; margin-bottom: 30px; font-size: 2em; }
        
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 10px; }
        
        /* Nova divisão para a parte inferior: Gráfico (2/3) e Ranking (1/3) */
        .bottom-container { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-top: 25px; padding-bottom: 40px; }
        
        .chart-box { background-color: #1e1f2b; padding: 25px; border-radius: 12px; border: 1px solid #2a2b3d; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        
        .chart-box h3 { margin-top: 0; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .title-cpu { color: #f39c12; }
        .title-ram { color: #3498db; }
        .title-hits { color: #e74c3c; }
        
        .canvas-container { position: relative; height: 350px; width: 100%; }
        .canvas-container-bottom { position: relative; height: 250px; width: 100%; }

        /* Estilos do Ranking Top 5 */
        .ranking-list { list-style: none; padding: 0; margin: 0; flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .ranking-item { background-color: #15161e; border: 1px solid #2a2b3d; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .ranking-item .name { font-weight: bold; color: #d1d1d1; }
        .ranking-item .hits { background-color: rgba(231, 76, 60, 0.15); color: #e74c3c; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.85em; }
        .ranking-empty { color: #9a9baf; text-align: center; margin-top: 50px; font-style: italic; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Trackmotor Master</h2>
        <a href="{% url 'master_dashboard' %}">📊 Visão Geral</a>
        <a href="{% url 'master_clientes' %}">👥 Lojas & Clientes</a>
        <a href="#" class="ativo">🖥️ Saúde do Servidor</a>
        <a href="/" style="margin-top: 30px; border: 1px solid #2a2b3d;">⬅ Voltar ao Site</a>
    </div>
    
    <div class="content">
        <h1>Saúde do Servidor e Tráfego</h1>
        
        <!-- Linha de Cima: CPU e RAM -->
        <div class="charts-container">
            <div class="chart-box">
                <h3 class="title-cpu">Uso de CPU - Tempo Real</h3>
                <div class="canvas-container">
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>

            <div class="chart-box">
                <h3 class="title-ram">Memória RAM - Tempo Real</h3>
                <div class="canvas-container">
                    <canvas id="ramChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Linha de Baixo: Gráfico de Hits e Ranking -->
        <div class="bottom-container">
            <div class="chart-box">
                <h3 class="title-hits">Tráfego (Requisições) - Tempo Real</h3>
                <div class="canvas-container-bottom">
                    <canvas id="hitsChart"></canvas>
                </div>
            </div>

            <!-- NOVO: Ranking de Consumidores -->
            <div class="chart-box">
                <h3 class="title-hits">Top 5 Consumidores (Hits)</h3>
                <ul class="ranking-list" id="rankingList">
                    <!-- O JavaScript vai injetar os utilizadores aqui -->
                    <div class="ranking-empty">A carregar dados...</div>
                </ul>
            </div>
        </div>
    </div>

    <script>
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: { min: 0, max: 100, grid: { color: '#2a2b3d' }, ticks: { color: '#9a9baf' } },
                    x: { grid: { display: false }, ticks: { color: '#9a9baf', maxTicksLimit: 10 } }
                },
                plugins: { legend: { display: false } }
            };
            
            const hitsOptions = JSON.parse(JSON.stringify(commonOptions));
            delete hitsOptions.scales.y.max;

            const ctxCpu = document.getElementById('cpuChart').getContext('2d');
            const cpuChart = new Chart(ctxCpu, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'CPU (%)', data: [], borderColor: '#f39c12', backgroundColor: 'rgba(243, 156, 18, 0.1)', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 2 }] },
                options: commonOptions
            });

            const ctxRam = document.getElementById('ramChart').getContext('2d');
            const ramChart = new Chart(ctxRam, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'RAM (%)', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 2 }] },
                options: commonOptions
            });

            const ctxHits = document.getElementById('hitsChart').getContext('2d');
            const hitsChart = new Chart(ctxHits, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Novos Hits', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 2 }] },
                options: hitsOptions
            });

            const limitePontos = 30; 
            
            // Variável de memória para criar o efeito Velocímetro
            let memoriaUltimoTotal = null; 

            function atualizarGraficos() {
                fetch('/master/api/saude/')
                    .then(resposta => resposta.json())
                    .then(dados => {
                        const agora = new Date();
                        const horaFormatada = agora.getHours().toString().padStart(2, '0') + ':' + 
                                              agora.getMinutes().toString().padStart(2, '0') + ':' + 
                                              agora.getSeconds().toString().padStart(2, '0');

                        // LÓGICA DO VELOCÍMETRO
                        let hitsAoVivo = 0;
                        if (memoriaUltimoTotal !== null) {
                            // Subtrai o total novo do total antigo. Se for igual, dá 0 (linha cai).
                            hitsAoVivo = dados.hits - memoriaUltimoTotal;
                        }
                        memoriaUltimoTotal = dados.hits; // Salva para a próxima rodada

                        if (cpuChart.data.labels.length >= limitePontos) {
                            cpuChart.data.labels.shift(); cpuChart.data.datasets[0].data.shift();
                            ramChart.data.labels.shift(); ramChart.data.datasets[0].data.shift();
                            hitsChart.data.labels.shift(); hitsChart.data.datasets[0].data.shift();
                        }

                        cpuChart.data.labels.push(horaFormatada); cpuChart.data.datasets[0].data.push(dados.cpu);
                        ramChart.data.labels.push(horaFormatada); ramChart.data.datasets[0].data.push(dados.ram);
                        
                        // Joga no gráfico apenas os cliques que ocorreram AGORA
                        hitsChart.data.labels.push(horaFormatada); hitsChart.data.datasets[0].data.push(hitsAoVivo);

                        cpuChart.update(); ramChart.update(); hitsChart.update();

                        const rankingList = document.getElementById('rankingList');
                        rankingList.innerHTML = ''; 

                        if (dados.top_users.length === 0) {
                            rankingList.innerHTML = '<div class="ranking-empty">Nenhum tráfego registado.</div>';
                        } else {
                            dados.top_users.forEach(user => {
                                const li = document.createElement('li');
                                li.className = 'ranking-item';
                                // O ranking continua mostrando o Total Histórico (útil para auditoria)
                                li.innerHTML = `<span class="name">${user.username}</span> <span class="hits">${user.requisicoes} hits totais</span>`;
                                rankingList.appendChild(li);
                            });
                        }
                    })
                    .catch(erro => console.error("Erro ao buscar dados:", erro));
            }

            atualizarGraficos();
            setInterval(atualizarGraficos, 2000);
        </script>
</body>
</html>
