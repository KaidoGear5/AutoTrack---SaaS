<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login Master - Trackmotor</title>
    
    <style>
        body { 
            background-color: #15161e; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background-color: #1e1f2b; 
            padding: 80px 60px; 
            border-radius: 20px; 
            border: 1px solid #2a2b3d; 
            width: 650px; /* Largura massiva para preencher a área demarcada */
            text-align: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            box-sizing: border-box; 
        }
        h2 { 
            color: #f39c12; 
            margin-top: 0; 
            margin-bottom: 60px;
            font-size: 3.5em; 
            letter-spacing: 1.5px;
        }
        input { 
            width: 100%; 
            box-sizing: border-box; 
            padding: 25px; 
            margin-bottom: 35px; 
            border-radius: 12px; 
            border: 1px solid #2a2b3d; 
            background-color: #15161e; 
            color: #fff; 
            font-size: 1.5em; 
        }
        input:focus {
            outline: none;
            border-color: #f39c12;
        }
        button { 
            width: 100%; 
            padding: 25px; 
            margin-top: 25px; 
            background-color: #f39c12; 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1.8em; 
            transition: 0.2s;
        }
        button:hover { 
            background-color: #d68910; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Acesso Master</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <input type="text" name="username" placeholder="Usuário" required autocomplete="off">
            <input type="password" name="password" placeholder="Senha" required>
            
            <button type="submit">Acessar Painel</button>
        </form>
    </div>

</body>
</html>
