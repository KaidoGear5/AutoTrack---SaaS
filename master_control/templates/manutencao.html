<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Em Manutenção - Trackmotor</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #15161e; 
            color: #fff; 
            display: flex; 
            height: 100vh; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
        }
        .box { 
            background-color: #1e1f2b; 
            padding: 70px 50px; 
            border-radius: 12px; 
            border: 1px solid #2a2b3d; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            max-width: 800px; /* Aumentado de 500px para 800px */
            width: 90%;
        }
        h1 { 
            color: #f39c12; 
            margin-top: 0; 
            font-size: 3.5em; /* Aumentado para dar mais destaque */
            margin-bottom: 25px;
        }
        p { 
            color: #9a9baf; 
            line-height: 1.6; 
            font-size: 1.6em; /* Letras muito maiores para facilitar a leitura */
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Sistema em Manutenção</h1>
        <p>Estamos realizando atualizações para melhorar a sua experiência no Trackmotor.</p>
        <p>Voltaremos em breve. Agradecemos a sua compreensão!</p>
    </div>
</body>
</html>
