<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoTrack - Realizar Vistoria</title>
</head>
<body style="background-color: #2c3e50; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;">

    <div style="background-color: #34495e; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); width: 600px; color: white;">
        <h2 style="color: #e67e22; text-align: center; margin-bottom: 5px;">Realizar Vistoria</h2>
        <p style="text-align: center; color: #bdc3c7; margin-bottom: 20px;">Veículo: {{ manutencao.veiculo }}</p>

        <form method="POST">
            {% csrf_token %}
            
            <label style="font-weight: bold; color: #f39c12;">Diagnóstico da Vistoria *</label><br>
            {{ form.diagnostico_vistoria }}
            
            <br><br>
            <label style="font-weight: bold; color: #f39c12;">Imagens de Evidência (Link URL)</label><br>
            {{ form.imagens_evidencia }}
            
            <hr style="border: 1px solid #2c3e50; margin: 25px 0;">

            <!-- SEÇÃO DE ORÇAMENTO PRÉVIO -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <label style="font-weight: bold; color: #f39c12;">Orçamento: Serviços e Peças</label>
                <button type="button" onclick="adicionarItem()" style="background-color: #2ecc71; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    + Adicionar Peça
                </button>
            </div>

            <div id="itens-container">
                <!-- 1. MÃO DE OBRA (FIXA, INEXCLUÍVEL E OBRIGATÓRIA) -->
                <div class="item-row" style="display: flex; gap: 10px; margin-bottom: 10px; background-color: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; border-left: 4px solid #e74c3c; align-items: center;">
                    <input type="text" name="descricao[]" value="Mão de Obra" readonly style="flex: 3; padding: 8px; border-radius: 4px; border: none; background-color: #7f8c8d; color: white; font-weight: bold; outline: none; cursor: not-allowed;">
                    <!-- Campo invisível que avisa o banco de dados que isso é Mão de Obra -->
                    <input type="hidden" name="tipo_item[]" value="MAO_DE_OBRA">
                    
                    <input type="number" step="0.01" name="preco[]" placeholder="R$ Valor" required style="flex: 1; padding: 8px; border-radius: 4px; border: none;" oninput="calcularTotal()">
                    
                    <!-- Espaço vazio para alinhar perfeitamente com os botões 'X' debaixo -->
                    <div style="width: 32px;"></div> 
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; background-color: #2c3e50; padding: 15px; border-radius: 5px; margin-top: 20px; border: 1px solid #f39c12;">
                <strong style="color: #f39c12; font-size: 16px;">$ Total Previsto</strong>
                <strong id="valor-total-display" style="color: #f39c12; font-size: 18px;">R$ 0,00</strong>
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px; background-color: #e67e22; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 25px; font-weight: bold;">
                Enviar Orçamento para o Cliente
            </button>
        </form>
    </div>

    <script>
        function calcularTotal() {
            let total = 0;
            const precos = document.querySelectorAll('input[name="preco[]"]');
            precos.forEach(function(input) {
                let valor = parseFloat(input.value);
                if (!isNaN(valor)) total += valor;
            });
            document.getElementById('valor-total-display').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function adicionarItem() {
            const container = document.getElementById('itens-container');
            const row = document.createElement('div');
            row.style.cssText = 'display: flex; gap: 10px; margin-bottom: 10px; align-items: center;';
            row.innerHTML = `
                <input type="text" name="descricao[]" placeholder="Ex: Pastilha de Freio..." required style="flex: 3; padding: 8px; border-radius: 4px; border: none;">
                <!-- O sistema já entende que as linhas criadas no botão são peças -->
                <input type="hidden" name="tipo_item[]" value="PECA">
                
                <input type="number" step="0.01" name="preco[]" placeholder="R$ 0,00" required style="flex: 1; padding: 8px; border-radius: 4px; border: none;" oninput="calcularTotal()">
                
                <button type="button" onclick="this.parentElement.remove(); calcularTotal();" style="background-color: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">X</button>
            `;
            container.appendChild(row);
        }
    </script>
</body>
</html>
