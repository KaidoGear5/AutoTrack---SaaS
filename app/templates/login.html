<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoTrack - Login</title>
</head>
<body style="background-color: #f4f4f9; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center;">
        <h2 style="color: #2c3e50; margin-bottom: 20px;">Entrar no AutoTrack</h2>

        <!-- Formulário de Login -->
        <form method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-weight: bold; color: #34495e;">Usuário:</label><br>
                <input type="text" name="username" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-weight: bold; color: #34495e;">Senha:</label><br>
                <input type="password" name="password" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <button type="submit" style="width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                Acessar Conta
            </button>
        </form>
        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <span style="color: #7f8c8d; font-size: 14px;">Ainda não é cliente?</span><br>
            <a href="{% url 'register' %}" style="color: #8e44ad; text-decoration: none; font-weight: bold; font-size: 15px; display: inline-block; margin-top: 5px;">
                Criar uma Conta Gratuita
            </a>
        </div>
    </div>

</body>
</html>
