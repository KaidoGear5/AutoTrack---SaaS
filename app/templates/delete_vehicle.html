<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoTrack - Excluir Veículo</title>
</head>
<body style="background-color: #f4f4f9; font-family: Arial, sans-serif; padding: 50px;">

    <div style="background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; text-align: center;">
        <h2 style="color: #e74c3c; margin-bottom: 20px;">Atenção! ⚠️</h2>
        
        <p style="color: #34495e; font-size: 16px;">
            Você tem certeza que deseja excluir permanentemente o veículo <strong>{{ carro.marca }} {{ carro.modelo }}</strong> (Placa: {{ carro.placa }})?
        </p>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">Esta ação não pode ser desfeita.</p>
        
        <!-- Formulário POST para Excluir Seguro -->
        <form method="POST">
            {% csrf_token %}
            <button type="submit" style="width: 100%; padding: 10px; background-color: #e74c3c; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 10px;">
                Sim, Excluir Veículo
            </button>
        </form>
        
        <div>
            <a href="{% url 'home' %}" style="display: block; padding: 10px; background-color: #bdc3c7; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">
                Cancelar e Voltar
            </a>
        </div>
    </div>

</body>
</html>
